<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f5f5;
        color: #222;
      }
      nav {
        background: #1f3a5f;
        padding: 1rem 2rem;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        margin-right: 1rem;
        font-weight: bold;
      }
      main {
        max-width: 1000px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .card {
        background: white;
        border-radius: 10px;
        padding: 1rem 1.25rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        margin-bottom: 1.5rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 0.75rem;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background: #eef3ff;
      }
      .status {
        display: inline-block;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: bold;
      }
      .available {
        background: #dff7e8;
        color: #176b3d;
      }
      .borrowed {
        background: #fde3e3;
        color: #9f1d1d;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1rem;
      }
      input, select, button {
        padding: 0.65rem 0.8rem;
        border: 1px solid #cfd8e3;
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        background: #1f3a5f;
        color: white;
        cursor: pointer;
      }
      .secondary {
        background: #4d698b;
      }
      h1, h2, h3 {
        margin-top: 0;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
      }
      .summary-box {
        background: white;
        border-radius: 10px;
        padding: 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/books">Books</a>
      <a href="/members">Members</a>
    </nav>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
